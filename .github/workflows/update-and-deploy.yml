# 매일 미국 장 마감 후 데이터를 새로 받아 GitHub Pages에 배포한다.
name: 데이터 갱신 및 배포

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 평일 22:17 UTC (한국 시간 다음날 07:17)
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 수집 (SEC · Yahoo · Wikipedia)
        env:
          # SEC는 연락처가 들어간 User-Agent를 권장한다. 저장소 Settings > Variables 에 등록 가능.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'PersonalStockDashboard contact@example.com' }}
        run: python3 scripts/fetch_data.py --out site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
